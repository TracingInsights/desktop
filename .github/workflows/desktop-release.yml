# Desktop app release — TEMPLATE FOR THE PUBLIC RELEASES REPO.
#
# This file does not run in the private tif1ai repo (private-repo release
# assets need a GitHub login to download, and private Actions minutes are
# limited). `desktop/scripts/publish-release.mjs` mirrors `desktop/` into the
# PUBLIC TracingInsights/desktop repo — with the desktop sources at
# the repository ROOT — and installs this file as
# `.github/workflows/desktop-release.yml` there. Actions are free on public
# repos, so the macOS/Windows/Linux builds run there at no cost and the
# published installers are downloadable by anyone.
#
# How a release ships:
#   1. Bump `version` in desktop/package.json (electron-updater compares
#      semver; it must be HIGHER than the current release).
#   2. From desktop/: `bun run publish:release` — syncs sources to the
#      public repo, commits, tags vX.Y.Z, pushes.
#   3. The tag push triggers this workflow, which builds mac (dmg+zip,
#      universal), win (nsis) and linux (AppImage+deb) in parallel and
#      publishes them + electron-updater metadata (latest*.yml) to the
#      GitHub Release for that tag ON THE PUBLIC REPO.
#
# Code signing (optional but required for macOS auto-update) — set these as
# secrets on the PUBLIC TracingInsights/desktop repo:
#   - macOS: CSC_LINK + CSC_KEY_PASSWORD (Developer ID cert) and
#     APPLE_ID + APPLE_APP_SPECIFIC_PASSWORD + APPLE_TEAM_ID (notarization).
#   - Windows: WIN_CSC_LINK + WIN_CSC_KEY_PASSWORD (or CSC_LINK +
#     CSC_KEY_PASSWORD). SignPath.io offers free Authenticode signing for OSS.
#   Without them electron-builder skips signing: macOS auto-update will not
#   work and Windows shows a SmartScreen "unknown publisher" warning.

name: Desktop release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Never cancel a publish mid-flight (a partially-uploaded release is worse
# than a slow one).
concurrency:
  group: desktop-release
  cancel-in-progress: false

jobs:
  build:
    name: Build + publish (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            electron-builder-args: --mac
          - os: windows-latest
            electron-builder-args: --win
          - os: ubuntu-latest
            electron-builder-args: --linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # Optional code-signing credentials — see header comment. Absent secrets
      # are simply unset and electron-builder skips signing.
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      # Windows runners sometimes cannot create hard links for electron-builder
      # (EPERM on the CI filesystem); the copy fallback avoids the failure.
      USE_HARD_LINKS: 'false'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: desktop-bun-install-${{ hashFiles('bun.lock') }}
          restore-keys: desktop-bun-install-

      - name: Install desktop dependencies
        run: bun install --frozen-lockfile

      # The generated icons are committed; regeneration must be a no-op.
      # Failing here catches an icon.svg change whose build/ files were not
      # synced (same contract as the stats manifest drift checks).
      - name: Verify committed icons match the source SVG
        run: |
          bun run icons
          git diff --exit-code -- build/

      # Resolve the release tag: the pushed tag on tag runs, otherwise
      # v<package version> for manual workflow_dispatch runs.
      - name: Resolve release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            VERSION=$(bun -e "console.log(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")
            echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          fi

      - name: Build installers and publish to GitHub Releases
        run: bunx electron-builder ${{ matrix.electron-builder-args }} --publish always --config.publish.tag=${{ steps.tag.outputs.tag }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

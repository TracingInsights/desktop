# electron-builder configuration (desktop/). Run from this directory:
#   bun install
#   bun run icons             # regenerate build/icon.{png,icns,ico} from assets/icon.png
#   bun run pack              # unpacked build in release/ (fast, for testing)
#   bun run dist:mac          # dmg (arm64, x64, universal) + zip (arm64, x64)
#   bun run dist:win          # nsis installer + portable exe (x64, arm64)
#   bun run dist:linux        # AppImage + deb + rpm + tar.gz via
#                             # scripts/linux-release.mjs (one run per
#                             # package type; --arch arm64, --skip rpm)
#   bun run publish:release   # mirror desktop/ to the public releases repo and
#                             # tag vX.Y.Z — its Actions workflow builds +
#                             # publishes the release (see desktop/README.md)
#
# Icons live in build/ (the buildResources dir) and are generated by
# desktop/scripts/generate-icons.mjs. Keep the generated files committed —
# electron-builder reads them at package time.
#
# Releases: the tif1ai repo is PRIVATE, so its release assets would require a
# GitHub login to download (and private-repo Actions minutes are limited).
# Installers are therefore published to the small PUBLIC mirror repo
# TracingInsights/desktop — `publish` below points electron-builder
# (and electron-updater in shipped apps) at it. See
# desktop/scripts/publish-release.mjs and desktop/README.md →
# "Releases & auto-update".
#
# Artifact names carry NO version so the site can deep-link the latest
# installers via GitHub's stable /releases/latest/download/<name> URLs
# (src/lib/desktop-downloads/catalog.ts on the site — keep the two in sync).
# Where one build writes several arches into ONE update file (Windows
# latest.yml, latest-mac.yml) the names must carry the arch: electron-updater
# picks the file whose name contains process.arch ("x64" / "arm64").
# Linux x64 keeps the plain ${productName}-linux.<ext> names (one arch per
# latest-linux*.yml); the release workflow's arm64 job overrides
# linux.artifactName with -linux-arm64. The pre-0.2.4 names
# TracingInsights-mac.dmg (universal) and TracingInsights-win.exe (x64
# installer) are re-uploaded as copies by the workflow so old links resolve.
#
# TODO (before first public release):
#   - Code signing: macOS Developer ID + notarization and Windows
#     Authenticode (SignPath.io is free for OSS; or unsigned + SmartScreen
#     warnings), Linux optional. macOS auto-update only works for signed +
#     notarized apps. Signing secrets are set on the PUBLIC releases repo.

# Branding: productName stays "TracingInsights" — it names the install
# folder, the user-data folder (keys, pets) and every download, so changing
# it would strand existing installs. The logo is assets/icon.png (the site's
# TracingInsights.com-Logo-400x400.png) → build/ + src/app-icon.png via
# `bun run icons`; the description (Linux menus, package managers) and the
# homepage come from package.json.
appId: com.tracinginsights.desktop
productName: TracingInsights
copyright: Copyright © 2026 TracingInsights
artifactName: ${productName}-${os}.${ext}
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - package.json
# Native pet (docs/DESKTOP_PETS_NATIVE_PLAN.md N5): scripts/fetch-native-pet.mjs
# fills resources/ti-pet/ with the pinned, hash-verified ti-pet binaries before
# a release build. Empty → the installer ships without it and the Electron pet
# runs (fallback). At runtime: process.resourcesPath/ti-pet/. The committed
# license texts (Petdex MIT, Native SDK Apache-2.0) always ship beside it.
extraResources:
  - from: resources/ti-pet
    to: ti-pet
    filter:
      - 'ti-pet-*'
      - 'LICENSE-*.txt'
      - 'THIRD-PARTY-NOTICES.md'
asar: true
npmRebuild: false
# electron-updater reads this to find updates. The PUBLIC releases repo
# (mirror of desktop/) builds and publishes installers + latest*.yml via its
# own Actions workflow; GH_TOKEN is injected by that workflow (or use a
# personal token for local publishing with --publish always).
publish:
  provider: github
  owner: TracingInsights
  repo: desktop
  releaseType: release
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  # Apple Silicon and Intel builds (smaller downloads) plus a universal dmg
  # for anyone unsure of their chip. Universal is safe because the app has no
  # native modules (pure JS + Electron's own prebuilds); the native pet ships
  # both arch binaries side by side (see x64ArchFiles). Only the per-arch zips
  # are update payloads (MacUpdater prefers arm64 files on Apple Silicon and
  # drops them on Intel), so latest-mac.yml never points at the universal one.
  artifactName: ${productName}-mac-${arch}.${ext}
  target:
    - target: dmg
      arch: [arm64, x64, universal]
    - target: zip
      arch: [arm64, x64]
  # Both native pet binaries ship in Resources/ti-pet/ (main.mjs picks
  # ti-pet-darwin-<process.arch>), so they are identical in the x64 and arm64
  # slices; @electron/universal refuses identical Mach-O files it is not told
  # about ("not covered by the x64ArchFiles rule").
  x64ArchFiles: 'Contents/Resources/ti-pet/ti-pet-darwin-*'
  darkModeSupport: true
win:
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: portable
      arch: [x64, arm64]
linux:
  # Icon set 16–512 px (Flatpak drops icons larger than 512 px).
  icon: build/icons
  # package.json desktopName = the .desktop file name, so the window's
  # app_id / WM_CLASS matches its menu entry and docks show the logo.
  syncDesktopName: true
  desktop:
    entry:
      Name: TracingInsights
      GenericName: F1 Statistics
      Keywords: F1;Formula 1;Formula One;Motorsport;Telemetry;Statistics;Racing;
  # Build these through scripts/linux-release.mjs (one electron-builder run
  # per package type), not `electron-builder --linux`: one run packs them in
  # parallel from one folder that the deb / rpm `package-type` marker is
  # written into. The Flatpak is built by its own release job
  # (`--linux flatpak`): it needs flatpak-builder + the Flathub runtimes, and
  # a failure there must not stop the other packages.
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  category: Utility
  synopsis: F1 statistics, telemetry, race ratings and an AI chat
  vendor: TracingInsights
deb:
  # electron-builder's defaults (FpmTarget) + what the native pet needs: GTK 4
  # and the WebP loader for gdk-pixbuf (Petdex sprites are WebP). Setting
  # `depends` replaces the defaults, so they are repeated here.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgtk-4-1
    - webp-pixbuf-loader
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  # One installer per arch (not one installer carrying both): both land in
  # latest.yml and electron-updater picks the one named for process.arch.
  buildUniversalInstaller: false
  artifactName: ${productName}-win-${arch}.${ext}
# Portable exe: runs without installing, never self-updates (PortableTarget
# writes no update info; src/update-support.mjs turns the updater off when
# PORTABLE_EXECUTABLE_DIR is set).
portable:
  buildUniversalInstaller: false
  artifactName: ${productName}-win-${arch}-portable.${ext}
# rpm: electron-builder's default depends (gtk3, libnotify, nss, …). GTK 4 and
# the WebP pixbuf loader the native pet wants are not required here (RHEL
# ships webp-pixbuf-loader only in EPEL): without them the pet falls back to
# the Electron pet window.
# Flatpak (beta): Flathub's current runtime + Electron base app (the builder
# default, 20.08, is end-of-life). The sandbox needs the tray
# (StatusNotifier), the Secret Service for safeStorage and notifications.
# Flatpak builds never self-update (no update info is written for them).
flatpak:
  runtimeVersion: '25.08'
  baseVersion: '25.08'
  finishArgs:
    - --socket=wayland
    - --socket=x11
    - --share=ipc
    - --device=dri
    - --socket=pulseaudio
    - --share=network
    - --filesystem=home
    - --talk-name=org.freedesktop.Notifications
    - --talk-name=org.kde.StatusNotifierWatcher
    - --talk-name=org.freedesktop.secrets

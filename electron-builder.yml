# electron-builder configuration (desktop/). Run from this directory:
#   bun install
#   bun run icons             # regenerate build/icon.{png,icns,ico} from assets/icon.png
#   bun run pack              # unpacked build in release/ (fast, for testing)
#   bun run dist:mac          # dmg + zip
#   bun run dist:win          # nsis installer
#   bun run dist:linux        # AppImage + deb
#   bun run publish:release   # mirror desktop/ to the public releases repo and
#                             # tag vX.Y.Z — its Actions workflow builds +
#                             # publishes the release (see desktop/README.md)
#
# Icons live in build/ (the buildResources dir) and are generated by
# desktop/scripts/generate-icons.mjs. Keep the generated files committed —
# electron-builder reads them at package time.
#
# Releases: the tif1ai repo is PRIVATE, so its release assets would require a
# GitHub login to download (and private-repo Actions minutes are limited).
# Installers are therefore published to the small PUBLIC mirror repo
# TracingInsights/desktop — `publish` below points electron-builder
# (and electron-updater in shipped apps) at it. See
# desktop/scripts/publish-release.mjs and desktop/README.md →
# "Releases & auto-update".
#
# Artifact names carry NO version (${productName}-${os}.${ext}) so the site
# can deep-link the latest installers via GitHub's stable
# /releases/latest/download/<name> URLs (src/lib/ai/desktop-bridge.ts
# DESKTOP_DOWNLOAD_LINKS — keep the two in sync).
#
# TODO (before first public release):
#   - Code signing: macOS Developer ID + notarization and Windows
#     Authenticode (SignPath.io is free for OSS; or unsigned + SmartScreen
#     warnings), Linux optional. macOS auto-update only works for signed +
#     notarized apps. Signing secrets are set on the PUBLIC releases repo.

appId: com.tracinginsights.desktop
productName: TracingInsights
artifactName: ${productName}-${os}.${ext}
directories:
  output: release
  buildResources: build
files:
  - src/**/*
  - package.json
asar: true
npmRebuild: false
# electron-updater reads this to find updates. The PUBLIC releases repo
# (mirror of desktop/) builds and publishes installers + latest*.yml via its
# own Actions workflow; GH_TOKEN is injected by that workflow (or use a
# personal token for local publishing with --publish always).
publish:
  provider: github
  owner: TracingInsights
  repo: desktop
  releaseType: release
mac:
  icon: build/icon.icns
  category: public.app-category.utilities
  # Universal binaries: one dmg/zip serves Apple Silicon and Intel, so the
  # site's single macOS download link works for everyone. Safe here because
  # the app has no native modules (pure JS + Electron's own prebuilds).
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  darkModeSupport: true
win:
  icon: build/icon.ico
  target:
    - nsis
linux:
  icon: build/icon.png
  target:
    - AppImage
    - deb
  category: Utility
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
